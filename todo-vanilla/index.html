<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts: DM Sans (UI) + DM Mono (accent) -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="app-wrapper">

    <!-- ── 헤더 ── -->
    <header class="app-header">
      <span class="header-logo">✦</span>
      <h1 class="header-title">My Tasks</h1>
      <!-- 진행 중 / 완료 카운터 -->
      <div class="header-stats">
        <span class="stat-badge stat-active">
          <span id="activeCount">0</span> 진행 중
        </span>
        <span class="stat-badge stat-done">
          <span id="doneCount">0</span> 완료
        </span>
      </div>
    </header>

    <!-- ── Todo 입력 영역 ── -->
    <section class="input-section">
      <div class="input-row">
        <input
          type="text"
          id="todoInput"
          class="todo-input"
          placeholder="새 할 일을 입력하세요…"
          maxlength="100"
          autocomplete="off"
        />
        <button id="addTodoBtn" class="btn-add" aria-label="Todo 추가">
          <span class="btn-add-icon">+</span>
          <span class="btn-add-text">추가</span>
        </button>
      </div>
    </section>

    <!-- ── Todo 목록 ── -->
    <main class="list-section">

      <!-- 진행 중 목록 -->
      <div class="list-group" id="activeTodoGroup">
        <p class="list-group-label">진행 중</p>
        <ul class="todo-list" id="activeTodoList">
          <!-- app.js에서 동적으로 렌더링 -->
        </ul>
        <p class="list-empty-msg" id="activeEmptyMsg">할 일을 추가해 보세요 🎯</p>
      </div>

      <!-- 완료 목록 -->
      <div class="list-group" id="doneTodoGroup">
        <p class="list-group-label label-done">완료됨</p>
        <ul class="todo-list" id="doneTodoList">
          <!-- app.js에서 동적으로 렌더링 -->
        </ul>
        <p class="list-empty-msg" id="doneEmptyMsg">완료된 항목이 없습니다</p>
      </div>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
