<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-wrapper">

    <!-- 헤더 영역 -->
    <header class="app-header">
      <div class="header-accent"></div>
      <h1 class="app-title">Todo</h1>
      <!-- 통계: 선택된 날짜 기준 완료 / 전체 개수 표시 -->
      <p class="app-stats">
        <span id="completedCount">0</span> / <span id="totalCount">0</span> 완료
      </p>
    </header>

    <!-- 일간 날짜 네비게이터 -->
    <section class="date-nav" aria-label="날짜 이동">
      <button id="prevDayBtn" class="date-nav-btn" aria-label="이전 날짜">&#8592;</button>
      <div class="date-nav-center">
        <!-- 선택된 날짜의 요일 -->
        <span id="selectedDayOfWeek" class="date-day-of-week"></span>
        <!-- 선택된 날짜 (YYYY. MM. DD 형식) -->
        <span id="selectedDateLabel" class="date-label"></span>
        <!-- 오늘 날짜일 때 표시되는 뱃지 -->
        <span id="todayBadge" class="today-badge">오늘</span>
      </div>
      <button id="nextDayBtn" class="date-nav-btn" aria-label="다음 날짜">&#8594;</button>
    </section>

    <!-- Todo 입력 영역 -->
    <section class="input-section">
      <div class="input-wrapper">
        <input
          type="text"
          id="todoInput"
          class="todo-input"
          placeholder="할 일을 입력하세요..."
          maxlength="100"
          autocomplete="off"
        />
        <button id="addBtn" class="add-btn" aria-label="Todo 추가">
          <span class="add-btn-icon">+</span>
        </button>
      </div>
      <!-- 빈 입력값 안내 메시지 (기본: 숨김) -->
      <p id="errorMessage" class="error-message" aria-live="polite"></p>
    </section>

    <!-- 필터 탭 영역 -->
    <nav class="filter-nav" aria-label="Todo 필터">
      <button class="filter-tab filter-tab--active" data-filter="all">전체</button>
      <button class="filter-tab" data-filter="active">진행 중</button>
      <button class="filter-tab" data-filter="completed">완료</button>
    </nav>

    <!-- Todo 목록 영역 -->
    <main class="list-section">
      <!-- Todo 항목이 없을 때 표시되는 빈 상태 -->
      <div id="emptyState" class="empty-state">
        <span class="empty-icon">✦</span>
        <p id="emptyStateMessage">아직 할 일이 없어요</p>
      </div>

      <!-- Todo 항목들이 동적으로 추가되는 리스트 -->
      <ul id="todoList" class="todo-list"></ul>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
